plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cooper.briefingwidget'
    compileSdk 34

    defaultConfig {
        applicationId "com.cooper.briefingwidget"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// 纯原生实现（Activity + RemoteViews），不引入任何第三方依赖：
// 网络用 HttpURLConnection，JSON 解析用系统自带的 org.json。
dependencies {
}
